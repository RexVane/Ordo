# Example: hardened/security-focused Helm values for Ordo.
#
# Notes:
# - This is a hardening overlay to stack on top of `values-prod.yaml`.
# - You MUST tailor networkPolicy ingress/egress to your cluster topology.
# - Ensure your external dependencies (Postgres/Redis/Milvus/MinIO/LLM) are reachable.
#
# Usage:
#   helm upgrade --install ordo deploy/helm/ordo -n ordo \
#     -f deploy/helm/ordo/examples/values-prod.yaml \
#     -f deploy/helm/ordo/examples/values-hardened.yaml

existingSecretName: "ordo-env"

security:
  hardened: true
  # Optional: guarantee a writable temp dir (useful with readOnlyRootFilesystem).
  tmpEmptyDir:
    enabled: true

# Run pods under a dedicated ServiceAccount (optional).
serviceAccount:
  create: true

# Safer default: do not mount Kubernetes API token into pods unless needed.
automountServiceAccountToken: false

prometheus:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
    additionalLabels: {}

grafana:
  dashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
