{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ordo.fullname" . }}-grafana-dashboard
  labels:
    {{- include "ordo.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    {{- with .Values.grafana.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  grafana-dashboard-ordo.json: |-
{{ .Files.Get "files/grafana-dashboard-ordo.json" | indent 4 }}
{{- end }}
